name: ingest

on:
  schedule:
    # Hourly: sparse crons get dropped by GitHub's scheduler; hourly fires reliably.
    - cron: '5 * * * *'
  workflow_dispatch:

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write   # the reel is published as a release asset
    env:
      SITE_URL: ${{ secrets.SITE_URL || 'https://informalbuff.vercel.app' }}
      INGEST_API_KEY: ${{ secrets.INGEST_API_KEY }}
      META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
      META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
      CLOUDINARY_CLOUD: ${{ secrets.CLOUDINARY_CLOUD || 'sq9i1aty' }}
      DRY_RUN: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # One job does both halves: sweep the feeds, then turn the best
      # candidates into stories. Keeps private-repo Action minutes low.
      - name: Sweep feeds
        run: |
          code=$(curl -s --max-time 60 -o sweep.json -w "%{http_code}" \
            -H "x-ingest-key: $INGEST_API_KEY" \
            "$SITE_URL/api/cron/ingest")
          head -c 500 sweep.json; echo
          test "$code" = "200"

      - name: Write stories
        run: |
          HOUR=$(date -u +%H)
          # Writing is the expensive step, so it runs every four hours while the
          # sweep stays hourly. Keeps private-repo Action minutes under budget.
          REM=$((10#$HOUR % 4))
          if [ "$REM" != "0" ]; then echo "hour $HOUR — sweep only, no writing"; exit 0; fi
          # Vercel Hobby kills a function at 60s, so each call writes at most two
          # stories. Four calls per writing cycle keeps each well inside that.
          # The writer can take two minutes when the model is slow, and a single
          # timeout must never fail the whole job — the push still has to run.
          # Edition hours push afterwards, so they write less and ship sooner.
          case "$HOUR" in
            00|07|12|15) ROUNDS=2 ;;
            *) ROUNDS=3 ;;
          esac
          for i in $(seq 1 $ROUNDS); do
            code=$(curl -s --max-time 240 -o write.json -w "%{http_code}" \
              -H "x-ingest-key: $INGEST_API_KEY" \
              "$SITE_URL/api/cron/write?limit=2&perDesk=1") || code=000
            head -c 400 write.json 2>/dev/null; echo
            if [ "$code" = "503" ]; then echo "writer not configured — nothing published"; break; fi
            if [ "$code" != "200" ]; then echo "write call $i returned $code — continuing"; continue; fi
          done

      # Scheduled workflows with sparse crons are unreliable on GitHub, so the
      # pushes ride on this hourly job instead of their own schedule.
      # The owner does not want a review queue: publish anything that has a real
      # picture and a real body, leave the rest behind.
      - name: Auto-publish ready drafts
        run: |
          curl -s --max-time 90 -X POST \
            -H "x-ingest-key: $INGEST_API_KEY" \
            "$SITE_URL/api/cron/autopublish" | head -c 400; echo

      - name: Push editions
        run: |
          HOUR=$(date -u +%H)
          echo "UTC hour is $HOUR"
          # GitHub's scheduler routinely fires this job 20-50 minutes late, so
          # each edition gets a two-hour window instead of a single hour. Miss
          # the slot by minutes and the edition still ships.
          case "$HOUR" in
            00) EDITION=morning;   ALLOW_RECAP=1 ;;
            01) EDITION=morning;   ALLOW_RECAP=0 ;;
            07) EDITION=afternoon; ALLOW_RECAP=1 ;;
            08) EDITION=afternoon; ALLOW_RECAP=0; SECOND_HOUR=1 ;;
            12) EDITION=evening;   ALLOW_RECAP=1 ;;
            13) EDITION=evening;   ALLOW_RECAP=0 ;;
            15) EDITION=night;     ALLOW_RECAP=1 ;;
            16) EDITION=night;     ALLOW_RECAP=0 ;;
            *)  EDITION=; ;;
          esac

          if [ -z "$EDITION" ]; then
            echo "not an edition window — skipping push"
            exit 0
          fi

          echo "edition=$EDITION recap=$ALLOW_RECAP"
          # The delayed second hour must never post a recap: the first hour
          # already shipped the fresh stories and a recap would duplicate them.
          export ALLOW_RECAP
          export SECOND_HOUR
          node src/push-bundles.js "$EDITION"
      # GitHub drops the separate reel cron often enough that slots went
      # missing. The reel now rides on this job, which already runs every hour
      # and tolerates a late start.
      - name: Publish reel for this edition
        env:
          # Release-asset hosting needs the token; it is not exported by default.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Without this the reel renders silent — it happened on 27 Nov.
          REEL_AUDIO: 'music/bed.mp3'
        run: |
          HOUR=$(date -u +%H)
          case "$HOUR" in
            00|01|07|08|12|13|15|16) ;;
            *) echo "not an edition window — no reel"; exit 0 ;;
          esac
          cd reel
          npm ci --prefer-offline --no-audit --no-fund
          node render.mjs --out out/reel.mp4 || { echo "render failed"; exit 0; }
          cd ..
          # A silent reel is a broken reel; never publish one.
          if ! ffprobe -v error -select_streams a -show_entries stream=codec_type -of csv=p=0 reel/out/reel.mp4 | grep -q audio; then
            echo "reel has no audio stream — not publishing"; exit 0
          fi
          node src/publish-reel.js || echo "reel publish failed — carousel already shipped"
