name: ingest

on:
  schedule:
    # Hourly: sparse crons get dropped by GitHub's scheduler; hourly fires reliably.
    - cron: '5 * * * *'
  workflow_dispatch:

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SITE_URL: ${{ secrets.SITE_URL || 'https://informalbuff.vercel.app' }}
      INGEST_API_KEY: ${{ secrets.INGEST_API_KEY }}
      META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
      META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
      CLOUDINARY_CLOUD: ${{ secrets.CLOUDINARY_CLOUD || 'sq9i1aty' }}
      DRY_RUN: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # One job does both halves: sweep the feeds, then turn the best
      # candidates into stories. Keeps private-repo Action minutes low.
      - name: Sweep feeds
        run: |
          code=$(curl -s -o sweep.json -w "%{http_code}" \
            -H "x-ingest-key: $INGEST_API_KEY" \
            "$SITE_URL/api/cron/ingest")
          head -c 500 sweep.json; echo
          test "$code" = "200"

      - name: Write stories
        run: |
          HOUR=$(date -u +%H)
          # Writing is the expensive step, so it runs every four hours while the
          # sweep stays hourly. Keeps private-repo Action minutes under budget.
          REM=$((10#$HOUR % 4))
          if [ "$REM" != "0" ]; then echo "hour $HOUR — sweep only, no writing"; exit 0; fi
          # Vercel Hobby kills a function at 60s, so each call writes at most two
          # stories. Four calls per writing cycle keeps each well inside that.
          for i in 1 2 3 4; do
            code=$(curl -s -o write.json -w "%{http_code}" \
              -H "x-ingest-key: $INGEST_API_KEY" \
              "$SITE_URL/api/cron/write?limit=2&perDesk=1")
            head -c 600 write.json; echo
            if [ "$code" = "503" ]; then echo "writer not configured — nothing published"; exit 0; fi
            if [ "$code" != "200" ]; then echo "write call $i returned $code"; break; fi
          done

      # Scheduled workflows with sparse crons are unreliable on GitHub, so the
      # pushes ride on this hourly job instead of their own schedule.
      - name: Push editions
        run: |
          HOUR=$(date -u +%H)
          echo "UTC hour is $HOUR"
          if [ "$HOUR" = "00" ] || [ "$HOUR" = "07" ] || [ "$HOUR" = "12" ] || [ "$HOUR" = "15" ]; then
            # Owner's call: every slot carries both the carousel and the reel.
            node src/push-bundles.js
          else
            echo "not an edition hour — skipping push"
          fi
