name: push-bundles

on:
  schedule:
    # 06:00, 12:30, 17:30, 21:00 IST
    - cron: '30 0 * * *'
    - cron: '0 7 * * *'
    - cron: '0 12 * * *'
    - cron: '30 15 * * *'
  workflow_dispatch:

concurrency:
  group: push-bundles
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SITE_URL: ${{ secrets.SITE_URL || 'https://informalbuff.vercel.app' }}
      INGEST_API_KEY: ${{ secrets.INGEST_API_KEY }}
      DRY_RUN: 'false'
      META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
      META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      CLOUDINARY_CLOUD: ${{ secrets.CLOUDINARY_CLOUD || 'sq9i1aty' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Push desk bundles
        run: node src/push-bundles.js
